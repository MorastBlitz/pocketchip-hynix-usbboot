# Keine zufaelligen MAC-Adressen - immer die feste Hardware-Adresse.
# r8723bs kommt mit wechselnden MACs nicht zurecht ("set-hw-addr: ...
# not successfully set (scanning)" stand jedes Mal kurz vor dem Haenger).
[device]
wifi.scan-rand-mac-address=no

[connection]
wifi.cloned-mac-address=permanent
ethernet.cloned-mac-address=permanent
