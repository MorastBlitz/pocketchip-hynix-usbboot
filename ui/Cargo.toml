[package]
name = "pocketchip-console"
version = "0.1.0"
edition = "2021"
authors = ["MorastBlitz", "Claude"]
license = "MIT"
description = "Retro terminal style touch console for the PocketCHIP"
repository = "https://github.com/MorastBlitz/pocketchip"

[features]
default = ["kms"]
# Target build: Slint directly on DRM/KMS, software renderer, libinput.
kms = ["slint/backend-linuxkms-noseat", "slint/backend-linuxkms-libinput"]
# Desktop preview (macOS/Linux window) for development.
desktop = ["slint/backend-winit"]

[dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-18", "renderer-software"] }
libc = "0.2"
png = "0.18"
vt100 = "0.18"

[build-dependencies]
slint-build = "1.19"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
